<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>下载应用</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #333;
            font-weight: 600;
        }

        .status-text {
            font-size: 16px;
            color: #666;
            margin: 20px 0;
            line-height: 1.6;
            min-height: 24px;
        }

        .error-text {
            color: #e74c3c;
            font-size: 14px;
            margin: 20px 0;
            line-height: 1.6;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            font-weight: 500;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.hidden {
            display: none;
        }

        /* 微信/QQ 引导提示样式 */
        .wechat-guide {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 15px;
            padding: 30px 20px;
            margin: 20px 0;
        }

        .wechat-guide-title {
            font-size: 18px;
            font-weight: bold;
            color: #856404;
            margin-bottom: 20px;
        }

        .wechat-guide-text {
            font-size: 16px;
            color: #856404;
            margin-top: 20px;
            line-height: 1.6;
        }

        .wechat-guide-arrow {
            font-size: 48px;
            margin: 20px 0;
            color: #856404;
        }

        /* 二维码容器 */
        .qrcode-container {
            margin: 30px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .qrcode-container canvas {
            border: 5px solid #f0f0f0;
            border-radius: 10px;
            background: white;
            padding: 10px;
            max-width: 100%;
            margin: 0 auto;
            display: block;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="pageTitle">下载应用</h1>
        <div id="statusContainer">
            <p class="status-text" id="statusText">正在检测环境...</p>
        </div>

        <!-- 微信/QQ 引导提示 -->
        <div id="wechatGuide" class="wechat-guide hidden">
            <div class="wechat-guide-title">请在浏览器中打开</div>
            <div class="wechat-guide-arrow">↗</div>
            <div class="wechat-guide-text">
                点击右上角 <strong>···</strong> 或 <strong>⋮</strong><br>
                选择 <strong>"在浏览器中打开"</strong>
            </div>
        </div>

        <!-- 错误提示 -->
        <div id="errorContainer" class="hidden">
            <p class="error-text" id="errorText"></p>
        </div>

        <!-- 应用商店按钮 -->
        <button id="appStoreButton" class="button hidden" onclick="openAppStore()">打开应用商店</button>

        <!-- 二维码容器 -->
        <div id="qrcodeContainer" class="qrcode-container hidden">
            <p class="status-text">请扫描二维码在手机上打开</p>
            <div id="qrcode"></div>
        </div>
    </div>

    <script src="qrcode.js"></script>
    <script>
        // 工具函数
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function showElement(id) {
            document.getElementById(id).classList.remove('hidden');
        }

        function hideElement(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function setText(id, text) {
            const element = document.getElementById(id);
            if (element) {
                element.textContent = text;
            }
        }

        // 环境检测
        const ua = navigator.userAgent;
        const isWeChat = /MicroMessenger/i.test(ua);
        const isQQ = /QQ\//i.test(ua) || /MQQBrowser/i.test(ua);
        const isAndroid = /Android/i.test(ua);
        const isIOS = /iPhone|iPad|iPod/i.test(ua);

        // URL 参数处理
        const packageName = getQueryParam('package');
        const pageTitle = getQueryParam('title') || '下载应用';

        // 设置页面标题
        document.title = pageTitle;
        setText('pageTitle', pageTitle);

        // 检查 package 参数
        if (!packageName) {
            setText('statusText', '');
            setText('errorText', '缺少必要的 package 参数，请提供正确的下载链接');
            showElement('errorContainer');
            hideElement('statusContainer');
        } else {
            // 页面状态
            let hasTriedLaunch = false;
            let appStoreTimeout = null;
            let appStoreUrl = '';

            // Android 打开应用商店
            function openAndroidAppStore() {
                appStoreUrl = `market://details?id=${packageName}`;
                const fallbackUrl = `https://play.google.com/store/apps/details?id=${packageName}`;
                
                try {
                    window.location.href = appStoreUrl;
                    // 如果 2 秒后页面还在，显示按钮
                    appStoreTimeout = setTimeout(() => {
                        showElement('appStoreButton');
                        setText('statusText', '如果未自动跳转，请点击下方按钮');
                    }, 2000);
                } catch (e) {
                    window.location.href = fallbackUrl;
                }
            }

            // iOS 获取 App Store 链接
            async function getIOSAppStoreUrl(bundleId) {
                try {
                    console.log('正在查询 Bundle ID:', bundleId);
                    const response = await fetch(`https://itunes.apple.com/lookup?bundleId=${bundleId}`);
                    const data = await response.json();
                    
                    console.log('iTunes API 返回数据:', data);
                    
                    if (data.results && data.results.length > 0) {
                        const appId = data.results[0].trackId;
                        console.log('找到 App ID:', appId);
                        // 使用 itms-apps:// 协议来打开 App Store（iOS 推荐方式）
                        return {
                            itmsUrl: `itms-apps://itunes.apple.com/app/id${appId}`,
                            httpsUrl: `https://apps.apple.com/app/id${appId}`
                        };
                    } else {
                        console.error('未找到对应的 App ID，返回结果:', data);
                        return null;
                    }
                } catch (e) {
                    console.error('获取 App Store 链接失败:', e);
                    return null;
                }
            }

            // iOS 尝试拉起应用
            async function tryLaunchIOSApp() {
                if (hasTriedLaunch) return;
                hasTriedLaunch = true;

                // 尝试使用自定义 scheme 拉起应用
                // 根据项目配置，iOS 应用的 scheme 是 assistant://
                const scheme = 'assistant://';
                let appInstalled = false;
                
                // 尝试拉起应用
                const startTime = Date.now();
                window.location.href = scheme;
                
                // 监听页面可见性变化
                const checkVisibility = () => {
                    if (document.hidden) {
                        appInstalled = true;
                        // 应用已拉起，隐藏状态文本
                        hideElement('statusContainer');
                    }
                };
                
                document.addEventListener('visibilitychange', checkVisibility);
                
                // 2 秒后检查是否成功拉起
                setTimeout(() => {
                    document.removeEventListener('visibilitychange', checkVisibility);
                    if (!appInstalled) {
                        // 应用未安装，打开 App Store
                        openIOSAppStore();
                    }
                }, 2000);
            }

            // iOS 打开 App Store
            async function openIOSAppStore() {
                setText('statusText', '正在打开 App Store...');
                const urlData = await getIOSAppStoreUrl(packageName);
                
                if (urlData) {
                    // 优先使用 itms-apps:// 协议
                    appStoreUrl = urlData.httpsUrl;
                    try {
                        // 先尝试使用 itms-apps:// 协议（iOS 推荐）
                        console.log('尝试使用 itms-apps:// 协议打开:', urlData.itmsUrl);
                        window.location.href = urlData.itmsUrl;
                        
                        // 如果 2 秒后页面还在，显示按钮并使用 https 链接
                        appStoreTimeout = setTimeout(() => {
                            showElement('appStoreButton');
                            setText('statusText', '如果未自动跳转，请点击下方按钮');
                        }, 2000);
                    } catch (e) {
                        console.error('使用 itms-apps:// 协议失败，尝试 https:', e);
                        // 如果 itms-apps:// 失败，尝试使用 https
                        try {
                            window.location.href = urlData.httpsUrl;
                            appStoreTimeout = setTimeout(() => {
                                showElement('appStoreButton');
                                setText('statusText', '如果未自动跳转，请点击下方按钮');
                            }, 2000);
                        } catch (e2) {
                            console.error('使用 https 协议也失败:', e2);
                            showElement('appStoreButton');
                            setText('statusText', '无法打开 App Store，请点击下方按钮手动打开');
                        }
                    }
                } else {
                    setText('statusText', '无法获取应用信息，请手动在 App Store 中搜索');
                    showElement('appStoreButton');
                }
            }

            // 统一的打开应用商店函数
            async function openAppStore() {
                if (appStoreTimeout) {
                    clearTimeout(appStoreTimeout);
                    appStoreTimeout = null;
                }
                
                if (isAndroid) {
                    openAndroidAppStore();
                } else if (isIOS) {
                    if (appStoreUrl) {
                        // 尝试使用 itms-apps:// 协议
                        const itmsUrl = appStoreUrl.replace('https://apps.apple.com', 'itms-apps://itunes.apple.com');
                        try {
                            window.location.href = itmsUrl;
                        } catch (e) {
                            window.location.href = appStoreUrl;
                        }
                    } else {
                        await openIOSAppStore();
                    }
                }
            }

            // 生成二维码
            function generateQRCode(url) {
                const qrcodeDiv = document.getElementById('qrcode');
                try {
                    // 清空容器
                    qrcodeDiv.innerHTML = '';
                    // 使用 QRCode.js 生成二维码
                    new QRCode(qrcodeDiv, {
                        text: url,
                        width: 200,
                        height: 200,
                        colorDark: '#000000',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H
                    });
                } catch (e) {
                    console.error('生成二维码失败:', e);
                    setText('statusText', '无法生成二维码，请复制链接到手机浏览器打开');
                }
            }

            // 主逻辑
            if (isWeChat || isQQ) {
                // 微信/QQ 环境
                setText('statusText', '');
                hideElement('statusContainer');
                showElement('wechatGuide');
            } else if (isAndroid) {
                // Android 环境
                setText('statusText', '正在打开应用商店...');
                openAndroidAppStore();
            } else if (isIOS) {
                // iOS 环境 - 先尝试拉起应用
                setText('statusText', '正在检测应用...');
                tryLaunchIOSApp();
            } else {
                // 无法识别的环境，生成二维码
                setText('statusText', '');
                hideElement('statusContainer');
                showElement('qrcodeContainer');
                generateQRCode(window.location.href);
            }
        }
    </script>
</body>
</html>
